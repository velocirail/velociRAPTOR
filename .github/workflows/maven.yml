# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write     # the test report is published as a check run
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK 25
      uses: actions/setup-java@v6.0.1
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # always(): a failed build is exactly when the test table is worth having, and the Maven step above
    # fails the job on the first failing test. require_tests stays false so a compile error - which
    # produces no surefire XML at all - is reported as the compile error it is, not as a missing report.
    - name: Publish test results
      uses: mikepenz/action-junit-report@v6.5.0
      if: always()
      with:
        report_paths: '**/target/surefire-reports/TEST-*.xml'
        check_name: Tests
        # Every test, grouped under its suite, listed in the run's job summary.
        detailed_summary: true
        include_passed: true
        group_suite: true
        # Only failures become annotations. annotate_notice would turn all ~219 passing tests into
        # notices, which GitHub truncates in the UI and which would bury the failures the annotations
        # exist to surface; the summary table above is what lists the full run.
        annotate_notice: false
        require_tests: false

    # server/openapi/ is build output regenerated by quarkus-smallrye-openapi on every package, so the
    # artifact is the spec as this commit's annotations actually describe it, not the committed copy.
    - name: Upload OpenAPI document
      uses: actions/upload-artifact@v7.0.1
      with:
        name: openapi-${{ github.ref_name }}
        path: server/openapi/
        if-no-files-found: error

    # server/openapi/ is committed so it can be read and generated against without building the server,
    # which is only worth anything while it matches the code. The build above regenerates it, so a diff
    # here means the annotations moved and the regenerated document was not committed. Deliberately
    # after the upload, so the regenerated document is still downloadable when this fails.
    - name: Check the committed OpenAPI document is up to date
      run: |
        if ! git diff --exit-code -- server/openapi/; then
          echo "::error::server/openapi/ is stale. Regenerate it with 'mvn -pl server -am package' and commit the result."
          exit 1
        fi

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v6.0.1
