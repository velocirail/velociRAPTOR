name: Build fat jar

# Builds the server as a single self-contained (uber) jar and uploads it as a workflow artifact.
# Release builds only: triggered by a v* tag.
on:
  push:
    tags: [ "v*" ]   # release versions

jobs:
  fat-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attaching assets to the release on a v* tag
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # Quarkus uber-jar lands at server/target/<finalName>-runner.jar. Tests are the job of maven.yml;
      # this workflow only packages the deployable, so -DskipTests keeps it fast.
      - name: Build server uber-jar
        run: mvn -B -pl server -am package -Dquarkus.package.jar.type=uber-jar -DskipTests
      - name: Upload fat jar
        uses: actions/upload-artifact@v7.0.1
        with:
          name: velociraptor-server-${{ github.ref_name }}
          path: server/target/*-runner.jar
          if-no-files-found: error
      # The package above regenerates server/openapi/, so the spec published here is the one this tag's
      # annotations describe rather than whatever copy happened to be committed.
      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7.0.1
        with:
          name: openapi-${{ github.ref_name }}
          path: server/openapi/
          if-no-files-found: error
      # Only on a release tag. The release is created
      # if the tag does not already have one.
      - name: Attach the OpenAPI document to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            server/openapi/openapi.yaml
            server/openapi/openapi.json
            server/target/*-runner.jar
          fail_on_unmatched_files: true
          # 0.x: the HTTP API is still free to change between tags, so every release this
          # workflow creates is a prerelease until the API is settled enough for a 1.0.
          prerelease: true
