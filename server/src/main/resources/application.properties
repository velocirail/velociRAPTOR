quarkus.container-image.name=velociraptor
quarkus.docker.dockerfile-jvm-path=../Dockerfile.jvm
quarkus.package.jar.type=uber-jar
quarkus.log.level=INFO
quarkus.management.enabled=true
# The feed has no default and must be passed in: velociraptor.gtfs.source.path (a local zip or directory, or an
# s3://bucket/key URI) and velociraptor.gtfs.source.format (gb-transit, or the deprecated dtd2gtfs). The server does
# not start without both.
velociraptor.raptor.servicedate.precompute=true
quarkus.s3.devservices.enabled=false
quarkus.s3.aws.region=eu-west-1
