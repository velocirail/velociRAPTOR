quarkus.container-image.name=velociraptor
quarkus.docker.dockerfile-jvm-path=../Dockerfile.jvm
quarkus.package.jar.type=uber-jar
quarkus.log.level=INFO
quarkus.management.enabled=true
velociraptor.gtfs.source.path=../fixtures/gtfs-sample
velociraptor.raptor.servicedate.precompute=true
quarkus.s3.devservices.enabled=false
quarkus.s3.aws.region=eu-west-1
# Durations on the wire are ISO 8601 strings (PT50M), not decimal seconds.
quarkus.jackson.write-durations-as-timestamps=false

# OpenAPI. The document is generated from the JAX-RS annotations and written to server/openapi/ at
# build time so it can be committed and handed to clients; it is deliberately not under
# META-INF/, which is where Quarkus reads a hand-written base document from and would merge the
# generated file into itself on the next build.
mp.openapi.extensions.smallrye.info.title=velociRAPTOR
mp.openapi.extensions.smallrye.info.version=${quarkus.application.version}
mp.openapi.extensions.smallrye.info.description=RAPTOR journey planning over a GTFS feed. Times on the wire are ISO 8601 with a UTC offset; the server works on the Europe/London clock, which is the one GTFS times and service dates are expressed on.
quarkus.smallrye-openapi.store-schema-directory=openapi
# A relative server URL: the host differs per environment, and the build machine's localhost is
# not a useful default to ship to a client.
mp.openapi.servers=/
